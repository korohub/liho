<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond sombre pour contraste -->
  <circle cx="32" cy="32" r="32" fill="#0f172a"/>

  <!-- Orbites plus grandes -->
  <g fill="none" stroke="#22c55e" stroke-width="2.5">
    <ellipse cx="32" cy="32" rx="30" ry="12"/>
    <ellipse cx="32" cy="32" rx="30" ry="12" transform="rotate(60, 32, 32)"/>
    <ellipse cx="32" cy="32" rx="30" ry="12" transform="rotate(-60, 32, 32)"/>
  </g>

  <!-- Noyau -->
  <circle cx="32" cy="32" r="9" fill="#4ade80"/>
</svg>
